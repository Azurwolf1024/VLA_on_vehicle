# 车载 —— 静对静
#
# 车停稳、地面不动: 目标钉在世界系, 载具不摇。这是**最容易**的一档,
# 也是"任务本身能不能做成"的基线 —— 后面船载的每一次失败, 都应该能归因到
# 比这多出来的那一项扰动上。
#
# 场景几何沿用同一套(甲板=车厢底板, 舷墙=护栏, 作业口=侧向取物口,
# 内置垃圾舱=车厢垃圾箱), surface_kind 换成 ground 只是把水面画成水泥地。
scene:
  surface_kind: ground
env:
  vehicle_kind: road
  vehicle_enabled: false      # 停稳: 连路面激励都关掉
  target_motion: pinned       # 地面上的垃圾不会自己动
