# 船载 —— 目标随海况（真实工况）
#
# 垃圾漂在水面上, 和船漂在**同一片波**上: 升沉是共模的, 会相互抵消;
# 剩下的才是姿态摆动让目标在甲板系里画圈。
#
# 实测(5 seeds, frame=deck, 抓取前目标在甲板系内的三维晃动峰峰值):
#   sea 0.35   pinned 19.3 mm  ->  surface 11.6 mm   (世界系 z 抬升 26.0 mm)
#   sea 1.00   pinned 66.7 mm  ->  surface 39.7 mm   (世界系 z 抬升 86.5 mm)
#
# 换句话说: **"目标随海况动"不会让任务变难, 反而让它在甲板系里更好追**。
# 最难的一档是 "目标钉在世界系 + 船在摇"（也就是 v0.2 之前的默认口径）。
env:
  target_motion: surface
  frame: deck
