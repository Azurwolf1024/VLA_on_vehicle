# 船载 —— 目标固连甲板（最严苛）
#
# 甲板上的货物/随船载物: 在世界系里它跟着船跑（sea 0.35 时 z 走 18.4 mm,
# sea 1.0 时 52.2 mm）, 但在甲板系里**完全静止**（0.0 mm）—— 控制器看来目标不动。
# 抓取偏差因此是三档里最小的（sea 1.0: 0.6 mm vs surface 3.2 / pinned 2.5）。
#
# 这一档的用途是把"目标在动"与"基座在动"彻底解耦:
# 若策略在 surface 档失败而在 deck 档成功, 问题就在"追动目标", 不在抗摇。
env:
  target_motion: deck
  frame: deck
