[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-vehicle"
version = "0.2.0"
description = "Vision-Language-Action grasping on a moving vehicle deck (MuJoCo + NERO arm)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "mujoco>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.0"]
vis = ["opencv-python>=4.8"]

[tool.setuptools.packages.find]
include = ["vla_vehicle*"]
