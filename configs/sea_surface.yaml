# 船载 —— 目标随海况（真实工况，也是目前最难的一档）
#
# 垃圾漂在水面上。它跟随的是**波面**，不是船体升沉 —— 这两者在默认海况下近乎反相
# （船升沉滞后 151°、幅值 0.34 倍），所以船和垃圾在竖直方向是**反向**运动的，
# 甲板系里的相对运动比"目标钉死"还大。
#
# 实测(5 seeds, frame=deck):
#   sea 0.35  目标晃 80.0 mm  err 1.5 mm   91 步
#   sea 1.00  目标晃 400.3 mm err 15.6 mm  140 步（单回合 168/169/167 —— 踩 170 上限）
#
# sea=1.0 的三个回合几乎贴着 max_decisions=170 通过, 偏差 21–24 mm。
# 也就是说这条任务目前在恶劣海况下是**临界**的: 海况再高一档, 或者物体再小一点,
# 就会开始失败。这是"目标随海况动"真正的代价, 而它不是精度问题, 是时间问题。
env:
  target_motion: surface
  surface_source: vehicle
  frame: deck
