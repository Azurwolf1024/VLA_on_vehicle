# 默认配置 —— 近海作业艇, 舷外水面取物, 3 件垃圾, 双相机 160x160
scene:
  img_width: 160
  img_height: 160
  deck_height: 0.12          # 低干舷: 臂要伸到水面上 0.45 m 处再向下 0.12 m
  work_side: -1.0            # -y 侧舷开作业口
  work_opening_half: 0.22
  bow_cam_pos: [0.66, 0.10, 1.05]
  bow_cam_target: [0.02, -0.10, -0.06]
  bow_cam_fovy: 56.0
  spawn_settle: 0.6

env:
  n_objects: 3
  dt_decision: 0.1          # 决策层 10 Hz
  dt_ctrl: 0.01             # 内环 100 Hz
  action_scale: 0.02        # 每决策步最大 2 cm
  max_decisions: 140        # 舷外取物行程约是原甲板任务的 2 倍
  vehicle_kind: sea
  vehicle_scale: 0.35       # 有义波高约 0.12 m 的近海工况
  lang: zh
  grasp_mode: attach
  frame: deck               # 垃圾在水面(世界系), 但投放目标是甲板上的桶 -> 指令活在甲板系
